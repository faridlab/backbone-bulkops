# Codegen policy for bulkops.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  - "src/application/service/bulk_events.rs"
  - "src/application/service/bulk_ports.rs"
  - "src/application/service/bulk_write_service.rs"
  # Own the hand-written bulkops SQL (the job header + (job, item_key)-deduped item inserts, the CAS
  # reserve that makes each apply at-most-once, the applied/failed outcome ledger, the counts roll-up,
  # the failure report, the requeue) that the write service orchestrates. Declared here — not renamed
  # with a `_custom` suffix — so the generator skips them wholesale; this declaration is what makes
  # editing them legitimate.
  - "src/infrastructure/persistence/bulk_job_repository.rs"
  - "src/infrastructure/persistence/bulk_job_item_repository.rs"
  - "tests/bulk_crm_seam.rs"
  - "tests/bulk_golden_cases.rs"
  - "tests/integrity_probes.rs"
  # Crash-recovery probes for the reconcile pass (confirmed / re-applied / cancelled exits, the age
  # fence, and the no-masking job roll-up). Hand-written — not schema-derived.
  - "tests/bulk_reconcile_probes.rs"
  # Shared hand-written test helpers (fake + real targets, sinks, pool). Not schema-derived.
  - "tests/common/mod.rs"
  # Cross-tenant RLS probe (council 2026-08-12 Rec #1): connects a NOBYPASSRLS non-superuser role
  # and asserts run_job is fenced across tenants. Hand-written — not schema-derived.
  - "tests/tenant_isolation.rs"
  - "scripts/**"
  # Hand-authored behavior (services + their HTTP surface). Examples:
  # - "src/application/service/onboarding_service.rs"
  # - "src/presentation/http/guarded_routes.rs"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  # - "tests/*_golden_cases.rs"
  # - "tests/integrity_probes.rs"

  # Hand-authored module documentation.
  - "docs/**"
